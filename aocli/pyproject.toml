[project]
name = "aocli"
version = "0.2.4"
description = "Manage Advent of Code puzzles."
readme = "README.md"
authors = [
    { name = "Sh4d0w", email = "contact@thesh4d0w.org" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rich-click>=1.9.8",
]

[project.scripts]
aocli = "aocli.main:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
